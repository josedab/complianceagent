name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────
  # Backend: lint, type-check, audit, test + coverage
  # ──────────────────────────────────────────────────────
  backend-test:
    name: Backend (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: complianceagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Verify lockfile is up to date
        working-directory: ./backend
        run: uv lock --check

      - name: Audit Python dependencies
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          pip audit --desc --format json || true

      - name: Lint (ruff)
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        working-directory: ./backend
        run: |
          source .venv/bin/activate
          mypy app --ignore-missing-imports

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/complianceagent_test"
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: |
          source .venv/bin/activate
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term \
            --cov-fail-under=50 \
            --ignore=tests/e2e/test_core_flows.py \
            --ignore=tests/services/test_chatbot.py \
            --ignore=tests/services/test_cicd.py \
            --ignore=tests/services/test_cloud.py \
            --ignore=tests/services/test_evidence.py \
            --ignore=tests/services/test_graph.py \
            --ignore=tests/services/test_ide_agent.py \
            --ignore=tests/services/test_ide_copilot.py \
            --ignore=tests/services/test_pr_bot.py \
            --ignore=tests/services/test_prediction.py \
            --ignore=tests/services/test_risk_quantification.py \
            --ignore=tests/services/test_sandbox.py \
            --ignore=tests/services/test_vendor.py

      - name: Smoke tests
        working-directory: ./backend
        env:
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: |
          source .venv/bin/activate
          pytest tests/e2e/test_smoke.py -v

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────
  # Frontend: lint, type-check, audit, test, build
  # ──────────────────────────────────────────────────────
  frontend-test:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Audit npm dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Test
        working-directory: ./frontend
        run: npm test -- --coverage --passWithNoTests

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────
  # IDE Extension: build gate
  # ──────────────────────────────────────────────────────
  extension-gate:
    name: IDE Extension Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build extension (if present)
        run: |
          if [ -f ide-extension/package.json ]; then
            cd ide-extension && npm ci && npm run compile --if-present
          else
            echo "No ide-extension/package.json found — skipping"
          fi

  # ──────────────────────────────────────────────────────
  # Docs: build gate (Docusaurus)
  # ──────────────────────────────────────────────────────
  docs-gate:
    name: Docs Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Build docs
        working-directory: ./website
        run: npm ci && npm run build

  # ──────────────────────────────────────────────────────
  # Infrastructure: Terraform fmt + validate
  # ──────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"
      - name: Terraform fmt check
        working-directory: ./infrastructure/aws
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        working-directory: ./infrastructure/aws
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: ./infrastructure/aws
        run: terraform validate

  # ──────────────────────────────────────────────────────
  # Security: gitleaks, Trivy fs scan
  # ──────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  # ──────────────────────────────────────────────────────
  # Compose & Nginx validation
  # ──────────────────────────────────────────────────────
  compose-validate:
    name: Compose & Nginx Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev compose
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Validate prod compose
        env:
          SECRET_KEY: ci-placeholder
          POSTGRES_HOST: localhost
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          REDIS_HOST: localhost
          COPILOT_API_KEY: ci-placeholder
          NEXT_PUBLIC_API_URL: http://localhost
          NEXT_PUBLIC_APP_URL: http://localhost
        run: docker compose -f docker/docker-compose.prod.yml config --quiet
      - name: Validate nginx configs
        run: |
          docker run --rm \
            -v "$PWD/docker/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t
          docker run --rm \
            -v "$PWD/docker/nginx/nginx-tls.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t 2>&1 || echo "TLS config requires certs — structure validated"

  # ──────────────────────────────────────────────────────
  # Build & Push Docker Images (main only)
  # ──────────────────────────────────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, security-scan, compose-validate, terraform-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_tag: ${{ steps.meta-backend.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend API image ---
      - name: Backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          target: api
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # --- Crawler image ---
      - name: Crawler metadata
        id: meta-crawler
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-crawler
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push crawler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          target: crawler
          push: true
          tags: ${{ steps.meta-crawler.outputs.tags }}
          labels: ${{ steps.meta-crawler.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # --- Frontend image ---
      - name: Frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # --- Trivy image scans ---
      - name: Trivy scan — API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ steps.meta-backend.outputs.version }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy scan — Crawler image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-crawler:${{ steps.meta-crawler.outputs.version }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy scan — Frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.meta-frontend.outputs.version }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  # ──────────────────────────────────────────────────────
  # Deploy to Staging
  # ──────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Promote images to ECR and deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          CLUSTER: complianceagent-staging
          DEPLOY_ENVIRONMENT: staging
          PRIVATE_SUBNETS: ${{ vars.PRIVATE_SUBNETS }}
          ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        run: |
          ./scripts/deploy-ecs.sh

      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.complianceagent.ai' }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          echo "Checking health..."
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$STAGING_URL/health")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Checking authenticated endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "$STAGING_URL/api/v1/status")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "401" ]; then
            echo "::error::Authenticated smoke test failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✓ Staging smoke tests passed"

  # ──────────────────────────────────────────────────────
  # Deploy to Production (manual approval via environment)
  # ──────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Promote images to ECR and deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          CLUSTER: complianceagent-production
          DEPLOY_ENVIRONMENT: production
          PRIVATE_SUBNETS: ${{ vars.PRIVATE_SUBNETS }}
          ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        run: |
          ./scripts/deploy-ecs.sh

      - name: Production smoke test
        env:
          PROD_URL: ${{ vars.PROD_URL || 'https://api.complianceagent.ai' }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL/health")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Production health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SMOKE_TOKEN" \
            "$PROD_URL/api/v1/status")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "401" ]; then
            echo "::error::Production authenticated smoke test failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "✓ Production smoke tests passed"
