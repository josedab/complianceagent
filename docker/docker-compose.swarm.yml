# ComplianceAgent — Docker Swarm Stack
# Deploy: docker stack deploy -c docker-compose.swarm.yml complianceagent
#
# This overlay extends docker-compose.prod.yml for Swarm mode with:
#   - Replicated services with rolling update/rollback policies
#   - Overlay network for cross-node communication
#   - Placement constraints for beat (single replica)
#
# Required env vars — same as docker-compose.prod.yml

x-backend-env: &backend-env
  ENVIRONMENT: production
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-require}
  REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_TLS: ${REDIS_TLS:-false}
  ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-}
  ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_BUCKET_REGULATIONS: ${S3_BUCKET_REGULATIONS:-regulations}
  S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:-compliance-evidence}
  S3_REGION: ${S3_REGION:-us-east-1}
  COPILOT_API_KEY: ${COPILOT_API_KEY:?COPILOT_API_KEY is required}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?AUTH_COOKIE_DOMAIN is required}
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@complianceagent.io}
  EMAIL_API_ENDPOINT: ${EMAIL_API_ENDPOINT:-}
  EMAIL_API_KEY: ${EMAIL_API_KEY:-}
  AVATAR_BUCKET: ${AVATAR_BUCKET:-avatars}
  SENTRY_DSN: ${SENTRY_DSN:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-update-config: &update-config
  parallelism: 1
  delay: 15s
  order: start-first
  failure_action: rollback
  monitor: 60s
  max_failure_ratio: 0.1

x-rollback-config: &rollback-config
  parallelism: 1
  delay: 10s
  order: start-first

services:
  # --- One-shot migration (restart_policy "none" = run-once in Swarm) ---
  migrate:
    image: ${REGISTRY:-ghcr.io/josedab}/complianceagent-api:${VERSION:-latest}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    deploy:
      restart_policy:
        condition: none
    networks:
      - app-network

  # --- Backend API (replicated) ---
  backend:
    image: ${REGISTRY:-ghcr.io/josedab}/complianceagent-api:${VERSION:-latest}
    environment:
      <<: *backend-env
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        <<: *update-config
      rollback_config:
        <<: *rollback-config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # --- Frontend (replicated) ---
  frontend:
    image: ${REGISTRY:-ghcr.io/josedab}/complianceagent-frontend:${VERSION:-latest}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NODE_ENV: production
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        <<: *update-config
      rollback_config:
        <<: *rollback-config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  # --- Celery Worker (crawler image, replicated) ---
  worker:
    image: ${REGISTRY:-ghcr.io/josedab}/complianceagent-crawler:${VERSION:-latest}
    command: ["celery", "-A", "app.workers", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      <<: *backend-env
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        <<: *update-config
      rollback_config:
        <<: *rollback-config
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers", "inspect", "ping", "--timeout", "5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # --- Celery Beat (single replica, global constraint) ---
  beat:
    image: ${REGISTRY:-ghcr.io/josedab}/complianceagent-api:${VERSION:-latest}
    command: ["celery", "-A", "app.workers", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        <<: *update-config
      rollback_config:
        <<: *rollback-config
      placement:
        max_replicas_per_node: 1
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  # --- Nginx (Swarm internal LB handles round-robin to backend/frontend) ---
  nginx:
    image: nginx:1.27-alpine
    ports:
      - target: 80
        published: 80
        mode: ingress
      - target: 443
        published: 443
        mode: ingress
    volumes:
      - type: bind
        source: ./nginx/nginx-prod.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./nginx/ssl
        target: /etc/nginx/ssl
        read_only: true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        <<: *update-config
      rollback_config:
        <<: *rollback-config
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"

networks:
  app-network:
    driver: overlay
    attachable: true
